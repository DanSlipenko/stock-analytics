<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Offline — StockPulse</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0e1a;
        color: #e2e8f0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border: 1px solid #1e2a3a;
        border-radius: 16px;
        background: #111827;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #f5f5f5, #a3a3a3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        color: #171717;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
      }
      button {
        width: 100%;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #f5f5f5;
        color: #171717;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #ffffff;
      }
      .status {
        margin: 16px 0 0;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">S</div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been cached yet. Pages and market data you've already visited stay
        available — reconnect to load the rest.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="status" id="status"></p>
    </div>
    <script>
      var status = document.getElementById('status');
      function render() {
        // `navigator.onLine` only reports the network interface, not whether the
        // server is reachable — so it drives the label, never an auto-reload.
        status.textContent = navigator.onLine
          ? 'Network available, but the app could not be reached.'
          : 'Waiting for a connection…';
      }
      // Only an actual offline -> online transition retries, so a captive or
      // dead connection can't put this page in a reload loop.
      window.addEventListener('online', function () {
        status.textContent = 'Connection restored — reloading…';
        location.reload();
      });
      window.addEventListener('offline', render);
      render();
    </script>
  </body>
</html>
